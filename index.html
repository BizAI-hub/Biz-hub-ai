<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biz-hub AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #0b5cff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 30px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
    }

    h1 {
      text-align: center;
      margin-top: 12px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      opacity: .8;
      margin-top: 5px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      background: rgba(255,255,255,.15);
      color: white;
    }

    .tabs button.active {
      background: #22c55e;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 13px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      min-height: 22px;
    }

    #dashboard {
      display: none;
      text-align: center;
    }

    .welcome {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .feature {
      background: rgba(255,255,255,.12);
      padding: 18px;
      border-radius: 15px;
      margin: 12px 0;
      text-align: left;
    }

    .logout {
      background: #ef4444;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN / SIGNUP -->
    <div id="authSection">

      <div class="logo">
        <div class="logo-circle">B</div>
        <h1>Biz-hub AI</h1>
        <p class="subtitle">Build. Connect. Grow.</p>
      </div>

      <div class="tabs">

        <button id="loginTab"
                class="active"
                onclick="showLogin()">
          Login
        </button>

        <button id="signupTab"
                onclick="showSignup()">
          Sign Up
        </button>

      </div>

      <div id="signupNameBox" class="hidden">

        <input
          type="text"
          id="name"
          placeholder="Full Name"
          autocomplete="name"
        >

      </div>

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="main-btn"
        onclick="submitForm()"
        id="submitBtn">
        Login
      </button>

      <div class="message" id="message"></div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard">

      <div class="logo">
        <div class="logo-circle">B</div>
      </div>

      <div class="welcome">
        Welcome to Biz-hub AI
      </div>

      <p id="userName"></p>
      <p id="userEmail"></p>

      <div class="feature">
        <h3>🤖 AI Business Assistant</h3>
        <p>
          Get help with your business ideas,
          marketing and growth.
        </p>
      </div>

      <div class="feature">
        <h3>💼 Business Hub</h3>
        <p>
          Connect and manage your business activities.
        </p>
      </div>

      <div class="feature">
        <h3>🚀 Grow Your Business</h3>
        <p>
          More powerful Biz-hub features will be
          added here.
        </p>
      </div>

      <button
        class="main-btn logout"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>


  <!-- ==========================================
       FIREBASE
       ========================================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    /* ==========================================
       YOUR FIREBASE CONFIGURATION
       ========================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAZHOldcPc_K_Pw4GQtLfaOy-6nrcIwDJI",

      authDomain:
        "buz-hub-ai.firebaseapp.com",

      projectId:
        "buz-hub-ai",

      storageBucket:
        "buz-hub-ai.firebasestorage.app",

      messagingSenderId:
        "103014637130",

      appId:
        "1:103014637130:web:99193c0ccbefb1fc9050b3",

      measurementId:
        "G-2HQE9MDT1V"
    };


    /* ==========================================
       INITIALIZE FIREBASE
       ========================================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* ==========================================
       LOGIN / SIGNUP MODE
       ========================================== */

    let mode = "login";


    window.showLogin = function () {

      mode = "login";

      document
        .getElementById("signupNameBox")
        .classList.add("hidden");

      document
        .getElementById("submitBtn")
        .innerText = "Login";

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("signupTab")
        .classList.remove("active");

      document
        .getElementById("password")
        .setAttribute("autocomplete", "current-password");

      clearMessage();
    };


    window.showSignup = function () {

      mode = "signup";

      document
        .getElementById("signupNameBox")
        .classList.remove("hidden");

      document
        .getElementById("submitBtn")
        .innerText = "Create Account";

      document
        .getElementById("signupTab")
        .classList.add("active");

      document
        .getElementById("loginTab")
        .classList.remove("active");

      document
        .getElementById("password")
        .setAttribute("autocomplete", "new-password");

      clearMessage();
    };


    /* ==========================================
       LOGIN / SIGNUP
       ========================================== */

    window.submitForm = async function () {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const message =
        document.getElementById("message");

      const submitBtn =
        document.getElementById("submitBtn");


      if (!email || !password) {

        message.innerText =
          "Please enter your email and password.";

        return;
      }


      if (password.length < 6) {

        message.innerText =
          "Password must be at least 6 characters.";

        return;
      }


      message.innerText =
        "Please wait...";

      submitBtn.disabled = true;


      try {

        /* ======================================
           SIGN UP
           ====================================== */

        if (mode === "signup") {

          const name =
            document
              .getElementById("name")
              .value
              .trim();


          if (!name) {

            message.innerText =
              "Please enter your full name.";

            submitBtn.disabled = false;

            return;
          }


          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          /* Save the user's name */

          await updateProfile(user, {

            displayName: name

          });


          message.innerText =
            "Account created successfully!";


          document
            .getElementById("email")
            .value = "";

          document
            .getElementById("password")
            .value = "";

        }


        /* ======================================
           LOGIN
           ====================================== */

        else {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          message.innerText =
            "Login successful!";

        }


      } catch (error) {

        console.error(error);

        let errorMessage =
          "Something went wrong. Please try again.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          errorMessage =
            "This email is already registered. Please login.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email address.";

        }

        else if (
          error.code ===
          "auth/weak-password"
        ) {

          errorMessage =
            "Password is too weak. Use at least 6 characters.";

        }

        else if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "Incorrect email or password.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "No account was found with this email.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "Incorrect password.";

        }


        message.innerText =
          errorMessage;

      }


      submitBtn.disabled = false;

    };


    /* ==========================================
       SHOW DASHBOARD
       ========================================== */

    function showDashboard(user) {

      document
        .getElementById("authSection")
        .style.display = "none";

      document
        .getElementById("dashboard")
        .style.display = "block";


      document
        .getElementById("userEmail")
        .innerText =
          user.email || "";


      document
        .getElementById("userName")
        .innerText =
          user.displayName
            ? "Hello, " + user.displayName
            : "";

    }


    /* ==========================================
       LOGOUT
       ========================================== */

    window.logout = async function () {

      try {

        await signOut(auth);

        document
          .getElementById("dashboard")
          .style.display = "none";

        document
          .getElementById("authSection")
          .style.display = "block";

        document
          .getElementById("email")
          .value = "";

        document
          .getElementById("password")
          .value = "";

        document
          .getElementById("name")
          .value = "";

        showLogin();

      }

      catch (error) {

        console.error(error);

        document
          .getElementById("message")
          .innerText =
            "Unable to logout. Please try again.";

      }

    };


    /* ==========================================
       CHECK LOGIN STATE
       ========================================== */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          showDashboard(user);

        }

        else {

          document
            .getElementById("dashboard")
            .style.display = "none";

          document
            .getElementById("authSection")
            .style.display = "block";

        }

      }
    );


    /* ==========================================
       CLEAR MESSAGE
       ========================================== */

    function clearMessage() {

      document
        .getElementById("message")
        .innerText = "";

    }

  </script>

</body>
      </html>
